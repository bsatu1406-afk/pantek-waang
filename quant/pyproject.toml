[project]
name = "orderflow-prop"
version = "0.1.0"
description = "Orderflow strategy + prop firm simulation for ES futures (v4 — 10-agent team)"
requires-python = ">=3.11"
dependencies = [
    "databento>=0.40",
    "polars>=1.0",
    "pandas>=2.0",
    "numpy<2.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "zstandard>=0.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF005"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
